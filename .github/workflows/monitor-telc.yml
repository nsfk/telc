name: monitor-telc

on:
  schedule:
    # moi 10 phut, 07:00–23:50 gio Viet Nam (UTC+7)
    - cron: "*/10 0-16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-telc
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # khong co requirements.txt -> KHONG dung `cache: pip`

      - name: Check IBK telc slots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELC_STATE: state/telc.json
        run: python telc_monitor.py

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
